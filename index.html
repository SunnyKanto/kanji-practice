const converter=OpenCC.Converter({from:'cn',to:'tw'})

const catalogCategoryIds={ "唐诗三百首":"catTang", "宋词":"catSong", "三字经":"catSan", "散文":"catProse", "经济学":"catEcon", "法律":"catLaw", "医学":"catMed", "股票":"catStock", "海运空运贸易物流":"catLogistics", "我的输入":"catCustom", "红楼梦":"catHonglou", "聊斋志异":"catLiaozhai", "三国演义":"catSanguo", "练习句子第一组":"catPractice1", "小说生僻字练习":"catNovelRare", "小说阅读练习":"catReading", "小说高级字50":"catAdvanced50", "小说词汇120":"catVocab120", "专业领域生僻字":"catProRare" }
const PRACTICE_STORAGE_KEY="kanji-practice-done"
const CUSTOM_SENTENCES_KEY="kanji-practice-custom"
const CUSTOM_SENTENCES_MAX=500

function getCustomSentences(){
try{
return JSON.parse(localStorage.getItem(CUSTOM_SENTENCES_KEY)||"[]")
}catch(e){ return [] }
}

function addCustomSentence(text){
const t=String(text).trim()
if(!t) return
let arr=getCustomSentences()
arr=arr.filter(x=>x!==t)
arr.push(t)
if(arr.length>CUSTOM_SENTENCES_MAX) arr=arr.slice(-CUSTOM_SENTENCES_MAX)
localStorage.setItem(CUSTOM_SENTENCES_KEY,JSON.stringify(arr))
}

function removeCustomSentence(text){
const t=String(text).trim()
if(!t) return
let arr=getCustomSentences().filter(s=>s!==t)
localStorage.setItem(CUSTOM_SENTENCES_KEY,JSON.stringify(arr))
}

function updateCustomSentence(oldText,newText){
const oldVal=String(oldText).trim()
const newVal=String(newText).trim()
if(!oldVal||!newVal||oldVal===newVal) return
let arr=getCustomSentences()
const i=arr.indexOf(oldVal)
if(i===-1) return
arr[i]=newVal
localStorage.setItem(CUSTOM_SENTENCES_KEY,JSON.stringify(arr))
removePracticed(oldVal)
}

function getPracticedSet(){
try{
return new Set(JSON.parse(localStorage.getItem(PRACTICE_STORAGE_KEY)||"[]"))
}catch(e){ return new Set() }
}

function addPracticed(text){
const t=String(text).trim()
if(!t) return
const set=getPracticedSet()
set.add(t)
localStorage.setItem(PRACTICE_STORAGE_KEY,JSON.stringify([...set]))
}

function removePracticed(text){
const t=String(text).trim()
if(!t) return
const set=getPracticedSet()
set.delete(t)
localStorage.setItem(PRACTICE_STORAGE_KEY,JSON.stringify([...set]))
}

function clearPracticed(){
localStorage.removeItem(PRACTICE_STORAGE_KEY)
buildCatalog()
}

function getCoverageStats(){
let sentences=0
const allText=[]
for(const list of Object.values(sentenceCatalog)) list.forEach(s=>allText.push(s))
getCustomSentences().forEach(s=>allText.push(s))
sentences=allText.length
const chars=new Set()
for(const s of allText) for(const c of s) if(c>="\u4e00"&&c<="\u9fff") chars.add(c)
return { sentences, uniqueChars:chars.size }
}

function showCoverageStats(){
const st=getCoverageStats()
const el=document.getElementById("coverageStats")
if(el) el.textContent="句子共 "+st.sentences+" 条，不重复汉字 "+st.uniqueChars+" 个（含我的输入）"
}

function buildCatalog(){
const root=document.getElementById("catalogRoot")
if(!root) return
root.innerHTML=""
let first=true
for(const [name,list] of Object.entries(sentenceCatalog)){
const div=document.createElement("div")

list.forEach(s=>{

if(done){ const badge=document.createElement("span"); badge.className="practiced-badge"; badge.textContent=" 已练"; li.appendChild(badge) }
li.appendChild(wrap)
li.title=done ? "点击取消「已练」" : "点击选用并开始学习"
li.onclick=(e)=>{

if(practiced.has(s)){ removePracticed(s); buildCatalog() }
else selectSentence(s)

// 按最长优先分词，返回 [{text, isWord}, ...]
function segmentText(text){
const wordList=Object.keys(wordsDict).sort((a,b)=>b.length-a.length)
const out=[]
let i=0
while(i<text.length){
let found=false
for(const w of wordList){
if(text.slice(i,i+w.length)===w){
out.push({text:w,isWord:true})
i+=w.length
found=true
break
}
}
if(!found){
out.push({text:text[i],isWord:false})
i++
}
}
return out
}

function startPractice(){

let text=document.getElementById("input").value
addPracticed(text)
addCustomSentence(text)

let simplified=document.getElementById("simplified")
let traditional=document.getElementById("traditional")
let japanese=document.getElementById("japanese")

simplified.innerHTML=""
traditional.innerHTML=""
japanese.innerHTML=""

let trad=converter(text)
const segments=segmentText(text)

for(const seg of segments){
const span=document.createElement("span")
span.className="char"
span.innerText=seg.text
span.onclick=seg.isWord ? ()=>showWord(seg.text) : ()=>showChar(seg.text)
simplified.appendChild(span)
}

for(const seg of segments){
const span=document.createElement("span")
span.className="char"
const tradText=converter(seg.text)
span.innerText=tradText
span.onclick=seg.isWord ? ()=>showWord(tradText) : ()=>showChar(tradText)
traditional.appendChild(span)
}

const japaneseDiv=document.getElementById("japanese")
const metaDiv=document.getElementById("sentenceMeta")
const meta=practiceSentenceMeta[text]
function fillJapanese(jp){
japaneseDiv.innerHTML=""
if(jp){
for(let char of jp){
const span=document.createElement("span")
span.className="char"
span.innerText=char
span.onclick=()=>showChar(char)
japaneseDiv.appendChild(span)
}
}else{
japaneseDiv.innerHTML="<span style='color:#999'>暂无翻译</span>"
}
}
if(meta){
if(meta.japanese){
japaneseDiv.innerHTML=""
for(let char of meta.japanese){
const span=document.createElement("span")
span.className="char"
span.innerText=char
span.onclick=()=>showChar(char)
japaneseDiv.appendChild(span)
}
}else{
japaneseDiv.innerHTML="<span style='color:#666'>翻译中…</span>"
fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair=zh-CN|ja")
.then(r=>r.json())
.then(data=>{
const jp=(data.responseData&&data.responseData.translatedText) ? data.responseData.translatedText : ""
fillJapanese(jp)
})
.catch(()=>{ japaneseDiv.innerHTML="<span style='color:#999'>翻译失败</span>" })
}
metaDiv.style.display="block"
metaDiv.innerHTML="<strong>拼音：</strong>"+(meta.pinyin||"")+"<br><strong>重点字：</strong>"+(meta.rareChars||"")
}else{
metaDiv.style.display="none"
metaDiv.innerHTML=""
japaneseDiv.innerHTML="<span style='color:#666'>翻译中…</span>"
fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair=zh-CN|ja")
.then(r=>r.json())
.then(data=>{
const jp=(data.responseData&&data.responseData.translatedText) ? data.responseData.translatedText : ""
fillJapanese(jp)
})
.catch(()=>{
japaneseDiv.innerHTML="<span style='color:#999'>翻译失败</span>"
})
}

buildCatalog()
simplified.scrollIntoView({ behavior: "smooth", block: "start" })
}

function randomSentence(){
const cats=getCheckedCatalogCategories()
if(cats.length===0){ document.getElementById("input").value=""; return }
const all=[]
cats.forEach(c=>{ const list=c==="我的输入"?getCustomSentences():(sentenceCatalog[c]||[]); list.forEach(s=>all.push(s)) })
if(all.length===0){ document.getElementById("input").value=""; return }
const s=all[Math.floor(Math.random()*all.length)]
document.getElementById("input").value=s
startPractice()
}

function initCatalog(){ buildCatalog(); showCoverageStats() }
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",initCatalog)
else initCatalog()

function showChar(c){
showCharOrWord(c)
}

function showWord(word){
showCharOrWord(word)
}

function showCharOrWord(text){
// 弹窗和笔顺显示点击的字形（简体或繁体）；释义用简体查词典
const simplified=toSimplified(text)
const wordData=text.length>1 ? (wordsDict[simplified]||null) : null
const charData=text.length===1 ? (dictionary[simplified]||null) : null

document.getElementById("popup").style.display="block"
document.getElementById("char").innerText=text

if(wordData){
document.getElementById("pinyin").innerText="拼音: "+wordData.pinyin
document.getElementById("kana").innerText="日文: "+wordData.kana
document.getElementById("meaning").innerText="意思: "+wordData.meaning
}else if(charData){
document.getElementById("pinyin").innerText="拼音: "+charData.pinyin
document.getElementById("kana").innerText="日文: "+charData.kana
document.getElementById("meaning").innerText="意思: "+charData.meaning
}else{
const py=window.getPinyin ? window.getPinyin(text) : ""
document.getElementById("pinyin").innerText=py ? "拼音: "+py : "暂无拼音"
document.getElementById("kana").innerText=""
document.getElementById("meaning").innerText=text.length>1 ? "(暂无该词条)" : ""
}

document.getElementById("writer").innerHTML=""
const charSelector=document.getElementById("charSelector")
const chars=Array.from(text)
const opts={width:200,height:200,padding:5,showOutline:true,strokeAnimationSpeed:1}

function showWriterForChar(c){
const writerEl=document.getElementById("writer")
writerEl.innerHTML=""
try{
const w=HanziWriter.create('writer',c,opts)
w.animateCharacter().catch(()=>{
writerEl.innerHTML="<p class='no-stroke-hint'>该字暂无笔顺数据<br>（常见于假名、标点或生僻字）</p>"
})
}catch(e){
writerEl.innerHTML="<p class='no-stroke-hint'>该字暂无笔顺数据<br>（常见于假名、标点或生僻字）</p>"
}
}

if(chars.length>1){

const btn=document.createElement("button")

charSelector.querySelectorAll(".char-btn").forEach(b=>b.classList.remove("active"))
btn.classList.add("active")
showWriterForChar(c)
}
charSelector.appendChild(btn)
})
showWriterForChar(chars[0])
}else{
charSelector.innerHTML=""
showWriterForChar(chars[0])
}
}
